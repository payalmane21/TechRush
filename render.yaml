services:
  - type: web
    name: eventhub-api
    env: node
    region: oregon
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: EMAIL_DEMO_MODE
        value: "true"
      - key: VERIFIED_DEMO_EMAIL
        value: payalmane2107@gmail.com
